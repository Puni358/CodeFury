<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>High Contrast Mode — AccessFill</title>
  <script src="shared.js"></script>
  <script>
    (function go() {
      try {
        // Prefer AF.savePrefs but shared.js may not be fully parsed yet; write directly to be safe.
        localStorage.setItem('af_prefs_contrast', 'extra-high');
        if (window.AF && window.AF.savePrefs) {
          window.AF.savePrefs({ contrast: 'extra-high' });
        }
      } catch (_) {}
      location.replace('dashboard.html');
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui; padding: 2rem;">Enabling high-contrast mode and opening the dashboard. If nothing happens, <a href="dashboard.html">go to Dashboard</a>.</p>
</body>
</html>
