<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AccessFill — Accessibility-first form assistance</title>
  <script src="supabase-web.js"></script>
  <script src="shared.js"></script>
  <script>
    (async function rootRedirect() {
      try {
        await window.AF.ensureAuthInit();
        if (window.AF.isLoggedIn()) {
          location.replace(window.AF.isOnboarded() ? 'dashboard.html' : 'onboarding.html');
        } else {
          location.replace('login.html');
        }
      } catch (_) {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui; padding: 2rem;">Redirecting… If nothing happens, <a href="login.html">go to sign in</a>.</p>
</body>
</html>
